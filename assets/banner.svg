<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="transit — signing the bytes is not signing the deed">
  <title>transit</title>

  <rect width="1200" height="320" fill="#0A0A0A"/>
  <rect y="313" width="1200" height="7" fill="#CFFF04"/>

  <!-- mark -->
  <g transform="translate(96, 88) scale(0.56)">
    <circle cx="128" cy="96" r="52" fill="none" stroke="#CFFF04" stroke-width="9" opacity="0.32"/>
    <line x1="62" y1="82" x2="194" y2="82" stroke="#CFFF04" stroke-width="8" stroke-linecap="round" opacity="0.32"/>
    <circle cx="152" cy="82" r="17" fill="#CFFF04"/>
    <path d="M52 196 L104 196 L112 216 L148 216 L156 196 L204 196"
          fill="none" stroke="#CFFF04" stroke-width="11"
          stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="272" y="158"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="82" font-weight="700" fill="#F0EDEA" letter-spacing="-1">transit</text>

  <text x="274" y="206"
        font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="26" fill="#8F8A82">Signing the bytes is not signing the deed.</text>

  <g transform="translate(274, 236)">
    <rect width="30" height="4" rx="2" fill="#CFFF04"/>
    <text x="46" y="8"
          font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="19" font-weight="600" fill="#CFFF04" letter-spacing="1.4">ADVANCED AI SOCIETY</text>
    <text x="306" y="8"
          font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="19" fill="#8F8A82">· PROOF-OF-CONTROL INITIATIVE</text>
  </g>
</svg>
