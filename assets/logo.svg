<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="transit">
  <title>transit</title>
  <desc>A body crossing a star, above the dip in the light curve its passage produces — how you measure something you cannot see directly.</desc>

  <rect width="256" height="256" rx="52" fill="#0A0A0A"/>

  <!-- the star: the only thing you actually observe -->
  <circle cx="128" cy="96" r="52" fill="none" stroke="#CFFF04" stroke-width="6" opacity="0.32"/>

  <!-- the chord: the path the hidden body takes across it -->
  <line x1="62" y1="82" x2="194" y2="82" stroke="#CFFF04" stroke-width="5" stroke-linecap="round" opacity="0.32"/>

  <!-- the body: never seen directly, only inferred from the dip -->
  <circle cx="152" cy="82" r="17" fill="#CFFF04"/>

  <!-- the light curve: ingress, occultation, egress -->
  <path d="M52 196 L104 196 L112 216 L148 216 L156 196 L204 196"
        fill="none" stroke="#CFFF04" stroke-width="7"
        stroke-linejoin="round" stroke-linecap="round"/>
</svg>
