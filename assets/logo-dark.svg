<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 172" width="520" height="172" role="img" aria-label="transit">
  <title>transit</title>
  <desc>A planet transiting a star, above the light curve its passage produces.</desc>

  <!-- the star: what you can observe -->
  <circle cx="82" cy="66" r="46" fill="none" stroke="#F0EDEA" stroke-width="2.5" opacity="0.30"/>
  <circle cx="82" cy="66" r="46" fill="#F0EDEA" opacity="0.06"/>

  <!-- the transit chord: the path the hidden body takes across it -->
  <line x1="30" y1="53" x2="134" y2="53" stroke="#F0EDEA" stroke-width="1.25"
        stroke-dasharray="3 5" opacity="0.42"/>

  <!-- the body itself: never observed directly, only inferred -->
  <circle cx="104" cy="53" r="14" fill="#CFFF04" stroke="#0A0A0A" stroke-width="2"/>

  <!-- the light curve: ingress, occultation, egress. the dip is the whole signal -->
  <path d="M 22 132 L 62 132 L 68 148 L 96 148 L 102 132 L 142 132"
        fill="none" stroke="#F0EDEA" stroke-width="3"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- the measured depth, marked -->
  <line x1="82" y1="132" x2="82" y2="148" stroke="#CFFF04" stroke-width="2.5"/>

  <text x="180" y="92"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="62" font-weight="600" letter-spacing="-1.5" fill="#F0EDEA">transit</text>
  <text x="183" y="122"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14.5" letter-spacing="0.5" fill="#F0EDEA" opacity="0.66">signing the bytes is not signing the deed</text>
</svg>
