name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      # Pinned versions, before the results step: the cross-language run needs
      # runtimes to find, and pinning them keeps `differential-host.json` from
      # drifting between CI runs for reasons unrelated to this crate.
      - uses: actions/setup-node@v4
        with: { node-version: '22.11.0' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.23.4' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12.7' }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3.6' }
      - name: results are current
        run: |
          ./scripts/regen-results.sh
          # `differential-host.json` is excluded on purpose: it is a
          # measurement of the machine that made it, so diffing it across
          # environments would fail for the wrong reason. The claim it
          # supports is gated by tests/acceptance.rs instead.
          git diff --exit-code -- results/ ':!results/differential-host.json' || {
            echo "results/ is stale — run ./scripts/regen-results.sh and commit"
            exit 1
          }

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: WtfJoke/setup-tectonic@v3
      # No `-Z shell-escape`: this preamble omits `minted`, so the build has
      # no pygments dependency to satisfy here.
      - run: cd paper && tectonic main.tex

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t transit:ci .
      - name: the demonstration must still demonstrate something
        run: |
          docker compose up -d
          # No sleep: demo.sh waits for both to accept connections itself,
          # because the distroless image has no shell for a healthcheck.
          ./scripts/demo.sh
          docker compose down
